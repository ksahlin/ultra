[package]
name = "ultra"
version = "0.3.0"
edition = "2021"
rust-version = "1.74"
description = "Splice alignment of long transcriptomic reads to a genome, guided by exon annotations"
license = "GPL-3.0-only"
repository = "https://github.com/ksahlin/ultra"

# The binary keeps the reference's exact name. Anything else and every script,
# Snakemake rule and conda recipe in the wild breaks.
[[bin]]
name = "uLTRA"
path = "src/main.rs"

[dependencies]
flate2 = "1"
libparasail-sys = "0.2"
# Built from source and linked statically: it supplies the headers namfinder
# needs (there are none to find when cross-compiling) and removes a shared
# dependency from the shipped binary.
libz-sys = { version = "1", features = ["static"], default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
flate2 = "1"

[build-dependencies]
cc = "1"
